name: Cross-repository citation contract

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-repo-citation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  rag-deterministic:
    name: RAG deterministic (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run offline tests
        run: uv run pytest

  crawler-deterministic:
    name: Crawler deterministic
    runs-on: ubuntu-latest
    steps:
      - name: Check out Geek-Crawler-v2
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/Geek-Crawler-v2
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install deterministic crawler browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:all

  backend-deterministic:
    name: Backend RAG contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out GeekBackend
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/GeekBackend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: GeekBackend
      - name: Check out pinned Geek-SEO dependency
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/Geek-SEO
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: Geek-SEO
      - name: Select Backend-pinned Geek-SEO revision
        run: |
          revision="$(cat GeekBackend/Geek-SEO.commit)"
          git -C Geek-SEO fetch origin "$revision" --depth=1
          git -C Geek-SEO checkout --detach "$revision"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run deterministic RAG contract tests
        working-directory: GeekBackend
        run: >-
          dotnet test GeekBackend.Tests/GeekBackend.Tests.csproj
          --configuration Release
          --filter
          "FullyQualifiedName~HttpGeekCrawlerRagClientTests|FullyQualifiedName~GccV2GeekCrawlerResearchResolverTests"
      - name: Run deterministic cross-service protocol tests
        working-directory: GeekBackend
        run: >-
          dotnet test GeekBackend.IntegrationTests/GeekBackend.IntegrationTests.csproj
          --configuration Release
          --filter
          "FullyQualifiedName~RagClientContractTests|FullyQualifiedName~GeekCrawlerE2ETests"

  ingest-limits-agree:
    name: Ingest limits agree
    runs-on: ubuntu-latest
    steps:
      - name: Check out Geek-Crawler-v2
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/Geek-Crawler-v2
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: Geek-Crawler-v2
      - name: Check out GeekBackend
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/GeekBackend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: GeekBackend
      # Two numbers in two repositories that have to be equal, and nothing in either build can
      # see the other. The crawler refuses a batch above its constant; GeekAPI rejects one above
      # its own with a 400 the crawler treats as fatal. Whichever is lower silently becomes the
      # real ceiling, and if the crawler's is the higher one every large batch fails at the
      # boundary.
      #
      # This is the only place both repositories exist at once, which is what makes it the place
      # the check belongs. A unit test in either repo can only pin its own half -- which both now
      # do -- and two tests passing separately is exactly the state the numbers drift in.
      - name: Compare crawler and server ingest limits
        shell: bash
        run: |
          set -euo pipefail
          ts_num() {
            grep -oE "export const $1 = [0-9_]+" Geek-Crawler-v2/src/storage/ingest-limits.ts \
              | grep -oE '[0-9_]+$' | tr -d '_'
          }
          cs_num() {
            grep -oE "public const int $1 = [0-9_]+" \
              GeekBackend/GeekAPI/Services/GeekCrawler/GeekCrawlerIngestLimits.cs \
              | grep -oE '[0-9_]+$' | tr -d '_'
          }
          status=0
          while read -r ts cs label; do
            a="$(ts_num "$ts" || true)"
            b="$(cs_num "$cs" || true)"
            if [[ -z "$a" || -z "$b" ]]; then
              echo "::error::could not read $label — crawler='$a' server='$b'. If a constant was renamed, update this check with it."
              status=1
            elif [[ "$a" != "$b" ]]; then
              echo "::error::$label disagree — Geek-Crawler-v2 $ts=$a but GeekBackend $cs=$b. The lower number is the real ceiling; raise both together."
              status=1
            else
              echo "$label agree: $a"
            fi
          done <<'PAIRS'
          MAX_LINKS_PER_BATCH MaxLinksPerBatch links-per-batch
          MAX_PAGES_PER_BATCH MaxPagesPerBatch pages-per-batch
          PAIRS
          exit "$status"

  creator-deterministic:
    name: Creator deterministic
    runs-on: ubuntu-latest
    steps:
      - name: Check out content-creator-v2
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/content-creator-v2
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # `npm test` (node --test on src/**/*.test.ts), not `test:ci:citation`: that script has never
      # existed in content-creator-v2, so this job failed with "Missing script" on every run from
      # 2026-09-11 onward and checked nothing. The creator's stake in the citation contract is
      # hierarchy-match.test.ts, which consumes the server-resolved `toolsByHeading` -- exactly the
      # structured-evidence hop this workflow guards.
      #
      # No playwright install: these are node:test units with no browser, so installing chromium
      # spent CI minutes on nothing.
      - run: npm test

  staging-citation-smoke:
    name: Staging citation smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      STAGING_RAG_URL: ${{ secrets.STAGING_RAG_URL }}
      STAGING_RAG_API_KEY: ${{ secrets.STAGING_RAG_API_KEY }}
      STAGING_RAG_RUN_ID: ${{ secrets.STAGING_RAG_RUN_ID }}
      STAGING_RAG_QUERY: ${{ vars.STAGING_RAG_QUERY }}
      STAGING_RAG_TOPIC: ${{ vars.STAGING_RAG_TOPIC }}
      STAGING_RAG_WRITING_INTENT: ${{ vars.STAGING_RAG_WRITING_INTENT }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect optional staging configuration
        id: staging-config
        shell: bash
        run: |
          if [[ -n "$STAGING_RAG_URL" && -n "$STAGING_RAG_API_KEY" && -n "$STAGING_RAG_RUN_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging smoke skipped; STAGING_RAG_URL, STAGING_RAG_API_KEY, and STAGING_RAG_RUN_ID are optional but must all be configured."
          fi
      - name: Verify health, query, page, and citation quote
        if: steps.staging-config.outputs.configured == 'true'
        run: python3 scripts/staging_citation_smoke.py
