name: Cross-repository citation contract

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-repo-citation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  rag-deterministic:
    name: RAG deterministic (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run offline tests
        run: uv run pytest

  crawler-deterministic:
    name: Crawler deterministic
    runs-on: ubuntu-latest
    steps:
      - name: Check out Geek-Crawler-v2
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/Geek-Crawler-v2
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install deterministic crawler browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:all

  backend-deterministic:
    name: Backend RAG contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out GeekBackend
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/GeekBackend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: GeekBackend
      # No Geek-SEO checkout. GeekBackend deleted the Geek-SEO layer and its
      # Geek-SEO.commit pin in 69de427 ("the Geek-SEO layer is gone for good",
      # 2026-09-29), so `cat GeekBackend/Geek-SEO.commit` fails and took this job
      # with it before a single test ran. GeekBackend has no ProjectReference
      # outside its own repo -- it builds and tests standalone -- so the checkout
      # was only ever feeding that pin.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # A --filter term that matches nothing is indistinguishable from one that matches many:
      # the terms are ORed per test, and `dotnet test` exits 0 on "No test matches the given
      # testcase filter". Measured on SDK 10.0.107: 3 terms -> 33 passed exit 0; third term
      # renamed to a class that does not exist -> 29 passed exit 0. TreatNoTestsAsError does not
      # help -- it needs a runsettings file and is whole-run, not per-term.
      #
      # This matters more than it looks. GeekBackend's only workflow runs on a schedule and is
      # filtered to Playwright, so these classes execute here and nowhere else. A silent zero
      # match means the receiver half of the webhook contract stops being checked at all.
      - name: Assert the contract test classes still exist
        working-directory: GeekBackend
        shell: bash
        run: |
          set -euo pipefail
          listed="$(dotnet test GeekBackend.Tests/GeekBackend.Tests.csproj \
            --configuration Release --list-tests --nologo)"
          status=0
          for cls in HttpGeekCrawlerRagClientTests GccV2GeekCrawlerResearchResolverTests \
                     RagIndexStatusWebhookContractTests PatchRagIndexStatusHopTests; do
            if ! grep -q "$cls" <<<"$listed"; then
              echo "::error::$cls matches no test in GeekBackend.Tests. It was renamed, moved or \
          deleted, and the --filter below would have passed silently."
              status=1
            fi
          done
          exit "$status"
      - name: Run deterministic RAG contract tests
        working-directory: GeekBackend
        run: >-
          dotnet test GeekBackend.Tests/GeekBackend.Tests.csproj
          --configuration Release
          --filter
          "FullyQualifiedName~HttpGeekCrawlerRagClientTests|FullyQualifiedName~GccV2GeekCrawlerResearchResolverTests|FullyQualifiedName~RagIndexStatusWebhookContractTests|FullyQualifiedName~PatchRagIndexStatusHopTests"
      - name: Run deterministic cross-service protocol tests
        working-directory: GeekBackend
        run: >-
          dotnet test GeekBackend.IntegrationTests/GeekBackend.IntegrationTests.csproj
          --configuration Release
          --filter
          "FullyQualifiedName~RagClientContractTests|FullyQualifiedName~GeekCrawlerE2ETests"

  ingest-limits-agree:
    name: Ingest limits agree
    runs-on: ubuntu-latest
    steps:
      - name: Check out Geek-Crawler-v2
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/Geek-Crawler-v2
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: Geek-Crawler-v2
      - name: Check out GeekBackend
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/GeekBackend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: GeekBackend
      # Two numbers in two repositories that have to be equal, and nothing in either build can
      # see the other. The crawler refuses a batch above its constant; GeekAPI rejects one above
      # its own with a 400 the crawler treats as fatal. Whichever is lower silently becomes the
      # real ceiling, and if the crawler's is the higher one every large batch fails at the
      # boundary.
      #
      # This is the only place both repositories exist at once, which is what makes it the place
      # the check belongs. A unit test in either repo can only pin its own half -- which both now
      # do -- and two tests passing separately is exactly the state the numbers drift in.
      - name: Compare crawler and server ingest limits
        shell: bash
        run: |
          set -euo pipefail
          ts_num() {
            grep -oE "export const $1 = [0-9_]+" Geek-Crawler-v2/src/storage/ingest-limits.ts \
              | grep -oE '[0-9_]+$' | tr -d '_'
          }
          cs_num() {
            grep -oE "public const int $1 = [0-9_]+" \
              GeekBackend/GeekAPI/Services/GeekCrawler/GeekCrawlerIngestLimits.cs \
              | grep -oE '[0-9_]+$' | tr -d '_'
          }
          status=0
          while read -r ts cs label; do
            a="$(ts_num "$ts" || true)"
            b="$(cs_num "$cs" || true)"
            if [[ -z "$a" || -z "$b" ]]; then
              echo "::error::could not read $label — crawler='$a' server='$b'. If a constant was renamed, update this check with it."
              status=1
            elif [[ "$a" != "$b" ]]; then
              echo "::error::$label disagree — Geek-Crawler-v2 $ts=$a but GeekBackend $cs=$b. The lower number is the real ceiling; raise both together."
              status=1
            else
              echo "$label agree: $a"
            fi
          done <<'PAIRS'
          MAX_LINKS_PER_BATCH MaxLinksPerBatch links-per-batch
          MAX_PAGES_PER_BATCH MaxPagesPerBatch pages-per-batch
          PAIRS
          exit "$status"

  webhook-contract-agrees:
    name: Index-status webhook contract agrees
    runs-on: ubuntu-latest
    steps:
      - name: Check out Geek-Crawler-Rag
        uses: actions/checkout@v5
        with:
          path: Geek-Crawler-Rag
      - name: Check out GeekBackend
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/GeekBackend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: GeekBackend
      # The same shape of problem as ingest-limits-agree, and here for the same reason. The RAG
      # posts index status to GeekAPI, which binds it by name over JSON -- so a field the sender
      # adds is bound by nothing and System.Text.Json discards it without an error, a log, or a
      # default worth reading. Five fields sat in that state until 2026-09-29, and the expensive
      # one was pagesSkippedUnusable: GeekAPI bound both benign skip reasons and dropped the one
      # that says the crawl stored pages it should not have, so a corpus gutted by 4xx error
      # bodies reported identically to a clean one.
      #
      # Each repo has a unit test pinning its own half against its own copy of the contract --
      # tests/test_index_status_webhook_contract.py and RagIndexStatusWebhookContractTests.cs.
      # Two tests passing separately against two files is exactly the state those files drift in,
      # so the copies have to be compared somewhere both repos exist. This is that place.
      # Only the `fields` map is compared. A byte diff also failed on a prose edit, so improving a
      # comment in one repo reddened the other's main for no behavioural reason.
      #
      # Merge order is mandatory and one-directional: GeekBackend has no PR CI, so land its copy
      # plus the DTO binding FIRST, then this repo. Either order leaves a window where main here is
      # red (push + the 06:17 cron) until both sides have merged. That is the unpinned cross-repo
      # dependency e8fa9ce warned about -- accepted here because the alternative is no cross-repo
      # check at all, but it is the reason the per-repo tests also pin their own half.
      - name: Compare the two copies of the wire contract
        shell: bash
        run: |
          set -euo pipefail
          python3 Geek-Crawler-Rag/scripts/compare_webhook_contract.py \
            Geek-Crawler-Rag/contracts/rag-index-status/webhook.v1.json \
            GeekBackend/contracts/rag-index-status/webhook.v1.json

  creator-deterministic:
    name: Creator deterministic
    runs-on: ubuntu-latest
    steps:
      - name: Check out content-creator-v2
        uses: actions/checkout@v5
        with:
          repository: jmartinemployment/content-creator-v2
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # `npm test` (node --test on src/**/*.test.ts), not `test:ci:citation`: that script has never
      # existed in content-creator-v2, so this job failed with "Missing script" on every run from
      # 2026-09-11 onward and checked nothing. The creator's stake in the citation contract is
      # hierarchy-match.test.ts, which consumes the server-resolved `toolsByHeading` -- exactly the
      # structured-evidence hop this workflow guards.
      #
      # No playwright install: these are node:test units with no browser, so installing chromium
      # spent CI minutes on nothing.
      - run: npm test

  staging-citation-smoke:
    name: Staging citation smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      STAGING_RAG_URL: ${{ secrets.STAGING_RAG_URL }}
      STAGING_RAG_API_KEY: ${{ secrets.STAGING_RAG_API_KEY }}
      STAGING_RAG_RUN_ID: ${{ secrets.STAGING_RAG_RUN_ID }}
      STAGING_RAG_QUERY: ${{ vars.STAGING_RAG_QUERY }}
      STAGING_RAG_TOPIC: ${{ vars.STAGING_RAG_TOPIC }}
      STAGING_RAG_WRITING_INTENT: ${{ vars.STAGING_RAG_WRITING_INTENT }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect optional staging configuration
        id: staging-config
        shell: bash
        run: |
          if [[ -n "$STAGING_RAG_URL" && -n "$STAGING_RAG_API_KEY" && -n "$STAGING_RAG_RUN_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging smoke skipped; STAGING_RAG_URL, STAGING_RAG_API_KEY, and STAGING_RAG_RUN_ID are optional but must all be configured."
          fi
      - name: Verify health, query, page, and citation quote
        if: steps.staging-config.outputs.configured == 'true'
        run: python3 scripts/staging_citation_smoke.py
