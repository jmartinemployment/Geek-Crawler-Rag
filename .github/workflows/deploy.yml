name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -H 2.24.101.90 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/hostinger_key -o StrictHostKeyChecking=no root@2.24.101.90 \
            "cd /docker/geek-crawler-rag && docker compose -f deploy/hostinger-compose.yml pull && docker compose -f deploy/hostinger-compose.yml up -d"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/hostinger_key -o StrictHostKeyChecking=no root@2.24.101.90 \
            "curl -s http://localhost:8080/health | jq ."
