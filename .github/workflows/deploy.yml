name: Deploy to Hostinger VPS

on:
  workflow_run:
    workflows: ["Build and push image"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # No ssh-keyscan. Every ssh call below passes StrictHostKeyChecking=no, so known_hosts is
      # never consulted -- the scan could fail the deploy but could not affect it. It did exactly
      # that on 2026-09-28: keyscan exited non-zero, it was the last command in this block so its
      # status became the step's, `2>/dev/null` hid the reason, and the deploy died before touching
      # the box. "Build and push image" was green, so the change looked shipped while the container
      # still ran the image from two days earlier.
      #
      # Removed rather than made non-fatal, because a keyscan nothing reads is read as evidence that
      # the host key is verified here. It is not: StrictHostKeyChecking=no trusts whatever answers.
      # Pinning the key in a secret and dropping that flag is the fix if this ever needs to be
      # verified for real; leaving a scan in place is not that fix and disguises its absence.
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key

      - name: Deploy
        run: |
          ssh -i ~/.ssh/hostinger_key -o StrictHostKeyChecking=no root@2.24.101.90 \
            'cd /docker/geek-crawler-rag && docker compose pull && docker compose up -d'

      # RAG is not public: the API binds to 127.0.0.1:8080 on the box, behind Caddy. Curling the
      # host's public IP on 8080 can never succeed, so the check runs over SSH on the box itself.
      - name: Verify health
        run: |
          for i in $(seq 1 12); do
            body=$(ssh -i ~/.ssh/hostinger_key -o StrictHostKeyChecking=no root@2.24.101.90 \
              'curl -fsS --max-time 10 http://localhost:8080/health') && \
              echo "$body" | grep -q '"status":"ok"' && echo "$body" && exit 0
            echo "waiting for API to come up ($i/12)..."
            sleep 10
          done
          echo "health check never returned status ok"
          exit 1
