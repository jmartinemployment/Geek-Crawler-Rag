# Geek-Crawler-Rag on Hostinger (colocated with Mongo).
# Caps: Qdrant ~3 GB RAM, search threads=1; API ~2 GB RAM; index concurrency=1.

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    environment:
      QDRANT__PERFORMANCE__MAX_SEARCH_THREADS: "1"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 3g
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      HOST: 0.0.0.0
      PORT: "8080"
    depends_on:
      qdrant:
        condition: service_healthy
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  qdrant_data:
