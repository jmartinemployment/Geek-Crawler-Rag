[project]
name = "geek-crawler-rag"
version = "0.1.0"
description = "Index Geek-Crawler Mongo HTML into Qdrant and serve English RAG retrieval"
readme = "README.md"
authors = [
    { name = "Jeff Martin", email = "jmartinemployment@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "lxml>=6.1.3",
    "motor>=3.7.1",
    "openai>=3.8.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.0",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
geek-crawler-rag = "geek_crawler_rag:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
