# Hostinger deploy — Qdrant + API colocated; Mongo stays in the separate `mongodb` project.
# Reach Mongo via host.docker.internal (host-gateway).

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    environment:
      QDRANT__PERFORMANCE__MAX_SEARCH_THREADS: "1"
    volumes:
      - qdrant_data:/qdrant/storage
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 3g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    image: ${GEEK_CRAWLER_RAG_IMAGE:-ghcr.io/jmartinemployment/geek-crawler-rag:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      QDRANT_URL: http://qdrant:6333
      MONGO_CRAWLER_URL: ${MONGO_CRAWLER_URL}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-geek_crawler}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_TOKENS_PER_MINUTE: ${OPENAI_EMBEDDING_TOKENS_PER_MINUTE:-400000}
      OPENAI_EMBEDDING_MAX_BATCH_TOKENS: ${OPENAI_EMBEDDING_MAX_BATCH_TOKENS:-50000}
      # Fail-closed: no in-process OpenAI retries / exponential backoff (by design).
      OPENAI_EMBEDDING_MAX_RETRIES: ${OPENAI_EMBEDDING_MAX_RETRIES:-0}
      EMBEDDING_QUARANTINE_DIR: ${EMBEDDING_QUARANTINE_DIR:-/var/lib/geek-crawler-rag/embedding_quarantine}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      INDEX_SCHEDULER_ENABLED: ${INDEX_SCHEDULER_ENABLED:-true}
      INDEX_SCHEDULER_INTERVAL_SECONDS: ${INDEX_SCHEDULER_INTERVAL_SECONDS:-300}
      INDEX_SCHEDULER_POLL_SECONDS: ${INDEX_SCHEDULER_POLL_SECONDS:-60}
      INDEX_JOB_LEASE_SECONDS: ${INDEX_JOB_LEASE_SECONDS:-900}
      INDEX_JOB_HEARTBEAT_SECONDS: ${INDEX_JOB_HEARTBEAT_SECONDS:-60}
      INDEX_SCHEDULER_MAX_ATTEMPTS: ${INDEX_SCHEDULER_MAX_ATTEMPTS:-5}
      INDEX_SCHEDULER_RETRY_SECONDS: ${INDEX_SCHEDULER_RETRY_SECONDS:-300}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-geek_crawler_chunks}
      QDRANT_UPSERT_DELAY_SECONDS: ${QDRANT_UPSERT_DELAY_SECONDS:-0.5}
      API_KEY: ${API_KEY:-}
      CONTEXT_MANIFEST_SIGNING_KEYS: ${CONTEXT_MANIFEST_SIGNING_KEYS:-{}}
      SKILL_SNAPSHOT_SIGNING_KEY: ${SKILL_SNAPSHOT_SIGNING_KEY:-}
      SKILL_SNAPSHOT_SIGNING_KEY_ID: ${SKILL_SNAPSHOT_SIGNING_KEY_ID:-default}
      INDEX_STATUS_WEBHOOK_URL: ${INDEX_STATUS_WEBHOOK_URL:-}
      INDEX_STATUS_WEBHOOK_KEY: ${INDEX_STATUS_WEBHOOK_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Survives container recreate; inspect failed OpenAI batches here.
      - embedding_quarantine:/var/lib/geek-crawler-rag/embedding_quarantine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  embedding_quarantine:
  qdrant_data:
