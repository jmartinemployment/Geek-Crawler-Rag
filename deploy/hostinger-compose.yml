# Hostinger deploy compose — uses a prebuilt image (no build context on VPS).
# Local/dev still uses ../docker-compose.yml with `build: .`.

services:
  api:
    image: ${GEEK_CRAWLER_RAG_IMAGE:-ghcr.io/jmartinemployment/geek-crawler-rag:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      # Cross-compose on same Docker host (mongodb + qdrant projects publish host ports).
      QDRANT_URL: ${QDRANT_URL:-http://172.17.0.1:6333}
      MONGO_CRAWLER_URL: ${MONGO_CRAWLER_URL}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-geek_crawler}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-geek_crawler_chunks}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
