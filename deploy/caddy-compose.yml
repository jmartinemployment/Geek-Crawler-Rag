# TLS terminator in front of geek-crawler-rag.
# Joins the existing geek-crawler-rag_default network and proxies to service `api`.

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - default
      - geek-crawler-rag_default
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: "0.25"

volumes:
  caddy_data:
  caddy_config:

networks:
  geek-crawler-rag_default:
    external: true
